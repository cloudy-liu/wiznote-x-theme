name: Release

on:
  push:
    tags:
      - "wiznote-x-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build release package
        id: build
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          version="${TAG_NAME#wiznote-x-}"

          mkdir -p dist/obsidian

          cp theme.css manifest.json dist/obsidian/
          (
            cd dist/obsidian
            zip -q ../obsidian-wiznote-x.zip theme.css manifest.json
          )

          cat > dist/release-notes.md <<EOF
          This release ships an updated Wiznote X theme package for Obsidian.

          - obsidian-wiznote-x.zip includes theme.css and manifest.json.
          - Updates in this release refine workspace chrome, markdown typography,
            code blocks, tables, callouts, and dual light/dark tokens.
          EOF

          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Wiznote X ${{ steps.build.outputs.version }}
          body_path: dist/release-notes.md
          files: |
            dist/obsidian-wiznote-x.zip
